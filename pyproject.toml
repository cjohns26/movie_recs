[project]
name = "movie-recs"
version = "0.1.0"
description = "Netflix-style movie recommender: ALS/item-item CF, MongoDB vector search, vLLM explanations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pydantic-settings>=2.6",
    "pymongo>=4.17.0",
]

[project.scripts]
movie-recs = "movie_recs.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_recs"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external services (Mongo/GPU); excluded by default in CI"]
