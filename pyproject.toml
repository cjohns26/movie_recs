[project]
name = "movie-recs"
version = "0.1.0"
description = "Netflix-style movie recommender: ALS/item-item CF, MongoDB vector search, vLLM explanations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "implicit>=0.7.3",
    "pandas>=3.0.5",
    "pydantic-settings>=2.6",
    "pymongo>=4.17.0",
    "scipy>=1.18.0",
]

[project.scripts]
movie-recs = "movie_recs.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_recs"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
    "scipy-stubs>=1.18.0.1",
]
# HTTP serving: the recommendation API and the embedding microservice.
serving = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]
# GPU/model runtime. Pulled in only by the embedding image and the offline
# embed jobs — `sentence-transformers` drags ~5 GB of CUDA torch wheels, which
# neither CI nor the API container should carry.
ml = [
    "sentence-transformers>=5.7.0",
]

[tool.uv]
# `ml` is deliberately excluded: `uv sync` (and CI) stays torch-free.
# Install it explicitly with `uv sync --group ml` (or `make sync-ml`).
default-groups = ["dev", "serving"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Neither ships type stubs or a py.typed marker, and no stub package exists.
module = ["implicit.*", "threadpoolctl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# In the `ml` group, so it is absent from CI's torch-free environment.
module = ["sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires external services (Mongo/GPU); excluded by default in CI"]
