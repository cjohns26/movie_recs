services:
  mongodb:
    hostname: mongodb
    image: mongodb/mongodb-atlas-local:8.0
    container_name: movie_recs_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - DO_NOT_TRACK=1

volumes:
  mongodb_data:
  mongodb_config:
